<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gymGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E073" />
      <stop offset="100%" stop-color="#00BF62" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00BF62" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Dark Round Rect Background -->
  <rect width="64" height="64" rx="16" fill="#0B0F19" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#gymGlow)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Iconic GYMEZY Dumbbell / Athletic Symbol with Emerald Glow -->
  <g filter="url(#shadow)" transform="translate(10, 10)">
    <!-- Dumbbell Left Weight -->
    <rect x="2" y="12" width="6" height="20" rx="3" fill="url(#gymGlow)" />
    <rect x="9" y="15" width="4" height="14" rx="2" fill="url(#gymGlow)" />
    
    <!-- Central Bar -->
    <rect x="13" y="19" width="18" height="6" rx="3" fill="#FFFFFF" />
    
    <!-- Dumbbell Right Weight -->
    <rect x="31" y="15" width="4" height="14" rx="2" fill="url(#gymGlow)" />
    <rect x="36" y="12" width="6" height="20" rx="3" fill="url(#gymGlow)" />
    
    <!-- Energy Accent Arc -->
    <path d="M 10 7 C 22 2, 32 2, 34 7" stroke="#00E073" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>